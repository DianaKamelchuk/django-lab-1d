{% extends 'shop/base.html' %}
{% block title %}Відновлення паролю — ShopUA{% endblock %}
{% block content %}
<div class="container auth-page">
    <div class="auth-card">
        <h1>Відновлення паролю</h1>
        <p>Введіть email — надішлемо код підтвердження.</p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn--primary btn--full">Надіслати код</button>
        </form>
        <p class="auth-links"><a href="{% url 'login' %}">← Назад до входу</a></p>
    </div>
</div>
{% endblock %}
