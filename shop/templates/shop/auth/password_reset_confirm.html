{% extends 'shop/base.html' %}
{% block title %}Введіть код — ShopUA{% endblock %}
{% block content %}
<div class="container auth-page">
    <div class="auth-card">
        <h1>Введіть код</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <span class="form-error">{{ field.errors.0 }}</span>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn--primary btn--full">Змінити пароль</button>
        </form>
    </div>
</div>
{% endblock %}
