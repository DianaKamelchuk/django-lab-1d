{% extends 'pages/base.html' %}

{% block content %}

<h1>{{ product.name }}</h1>

{% if product.image %}

{% endif %}

<p>{{ product.description }}</p>
<p>Ціна: {{ product.price }} грн</p>

<button>Купити</button>

<a href="/">← Назад</a>

{% endblock %}
