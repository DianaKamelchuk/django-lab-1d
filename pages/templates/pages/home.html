<div class="products">

{% for product in products %}
    <div class="product-card">

        <a href="/product/{{ product.id }}/">
            <img src="{{ product.image.url }}">
        </a>

        <h3>{{ product.name }}</h3>

        <p class="price">{{ product.price }} грн</p>

        <a href="/add-to-cart/{{ product.id }}/">
            <button class="buy-btn-small">Купити</button>
        </a>

    </div>
{% endfor %}

</div>
