{% extends 'pages/base.html' %}

{% block content %}
<h1>Категорія</h1>

{% for product in products %}
    <div>
        <h3>
            <a href="/product/{{ product.id }}/">
                {{ product.name }}
            </a>
        </h3>
        <p>{{ product.description }}</p>
        <p>Ціна: {{ product.price }}</p>
    </div>
{% endfor %}

<a href="/">На головну</a>

{% endblock %}
